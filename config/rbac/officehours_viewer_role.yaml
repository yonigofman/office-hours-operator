# This rule is not used by the project office-hours-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to scheduling.yonigofman.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: office-hours-operator
    app.kubernetes.io/managed-by: kustomize
  name: officehours-viewer-role
rules:
- apiGroups:
  - scheduling.yonigofman.github.io
  resources:
  - officehours
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - scheduling.yonigofman.github.io
  resources:
  - officehours/status
  verbs:
  - get
