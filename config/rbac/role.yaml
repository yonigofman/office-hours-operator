---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - scheduling.yonigofman.github.io
  resources:
  - officehours
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - scheduling.yonigofman.github.io
  resources:
  - officehours/finalizers
  verbs:
  - update
- apiGroups:
  - scheduling.yonigofman.github.io
  resources:
  - officehours/status
  verbs:
  - get
  - patch
  - update
